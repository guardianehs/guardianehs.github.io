<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guardian Ghost — Live Security Monitor</title>
<style>
:root{color-scheme:dark;--bg:#080b10;--panel:#10151c;--line:#222b36;--text:#edf2f7;--muted:#8b98a8;--ok:#42d392;--warn:#ffca5c;--bad:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#172332 0,#080b10 42%);font:14px/1.5 system-ui,sans-serif;color:var(--text)}main{max-width:1200px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.eyebrow{color:#7dd3fc;text-transform:uppercase;letter-spacing:.12em;font-size:11px}.status{padding:8px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}.status.live{color:var(--ok);border-color:#245b43}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:rgba(16,21,28,.9);border:1px solid var(--line);border-radius:14px;padding:16px}.kpi{font-size:30px;font-weight:750}.label{color:var(--muted);font-size:12px}.stream{margin-top:16px}.event{display:grid;grid-template-columns:120px 1fr 90px;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.sev{font-size:11px;text-transform:uppercase;font-weight:700}.sev-critical,.sev-high{color:var(--bad)}.sev-medium{color:var(--warn)}.sev-low{color:#7dd3fc}.sev-info{color:var(--muted)}.mono{font-family:ui-monospace,monospace}.empty{padding:40px;text-align:center;color:var(--muted)}button{background:#18212c;color:var(--text);border:1px solid var(--line);padding:9px 12px;border-radius:9px;cursor:pointer}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.event{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main>
<div class="top"><div><div class="eyebrow">Guardian EHS · Ghost security</div><h1>Live monitor</h1><div style="color:var(--muted)">Ghost CMS webhooks → Supabase → browser Realtime</div></div><div><span id="status" class="status">Connecting…</span> <button id="refresh">Refresh</button></div></div>
<section class="grid"><div class="card"><div id="events" class="kpi">—</div><div class="label">Events, 24h</div></div><div class="card"><div id="high" class="kpi">—</div><div class="label">High / critical</div></div><div class="card"><div id="published" class="kpi">—</div><div class="label">Published events</div></div><div class="card"><div id="latest" class="kpi">—</div><div class="label">Last event</div></div></section>
<div class="card stream"><h2>Event stream</h2><div id="list" class="empty">Waiting for a signed-in master session…</div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const CLOUD=window.GUARDIAN_CLOUD||{url:'https://yhiwmwkrtvqkeevcgkqj.supabase.co',anonKey:'sb_publishable_jcmNK-g19f_YIfy8pJsJjw_OyM1R4qJ'};
const sb=window.supabase.createClient(CLOUD.url,CLOUD.anonKey,{auth:{persistSession:true,autoRefreshToken:true}});let rows=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function draw(){const now=Date.now(),day=rows.filter(x=>now-new Date(x.created_at).getTime()<86400000);document.querySelector('#events').textContent=day.length;document.querySelector('#high').textContent=day.filter(x=>['high','critical'].includes(x.severity)).length;document.querySelector('#published').textContent=day.filter(x=>x.event.includes('published')).length;document.querySelector('#latest').textContent=rows[0]?new Date(rows[0].created_at).toLocaleTimeString():'—';document.querySelector('#list').innerHTML=rows.length?rows.slice(0,80).map(x=>`<div class="event"><div class="mono">${esc(new Date(x.created_at).toLocaleTimeString())}</div><div><b>${esc(x.event)}</b><div style="color:var(--muted)">${esc(x.target_url||x.rule||'')}</div></div><div class="sev sev-${esc(x.severity)}">${esc(x.severity)}</div></div>`).join(''):'<div class="empty">No events.</div>';}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){document.querySelector('#status').textContent='Sign in as master';return;}const {data:p}=await sb.from('profiles').select('role').eq('id',session.user.id).single();if(p?.role!=='master'){document.querySelector('#status').textContent='Master access required';return;}await load();const ch=sb.channel('ghost-live').on('postgres_changes',{event:'*',schema:'public',table:'ghost_events'},p=>{if(p.new)rows=[p.new,...rows.filter(x=>x.id!==p.new.id)].slice(0,200);draw();}).subscribe(s=>{document.querySelector('#status').textContent=s==='SUBSCRIBED'?'● Live':'Reconnecting…';document.querySelector('#status').classList.toggle('live',s==='SUBSCRIBED');});}
async function load(){const {data,error}=await sb.from('ghost_events').select('id,event,severity,target_url,rule,created_at').order('created_at',{ascending:false}).limit(200);if(error){document.querySelector('#status').textContent=error.message;return;}rows=data||[];draw();}
document.querySelector('#refresh').onclick=load;boot();
</script></body></html>
